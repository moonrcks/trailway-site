<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Live ride on Trailway</title>
<meta property="og:title" content="Follow my ride live on Trailway">
<meta property="og:description" content="See where I am on my bike ride, updated as I ride.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg: #f4eee1; --card: #fbf8f1; --fg: #23291f; --muted: #5a4332; --accent: #2d4a36; --live: #b4532a; --line: #e2d8c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161b17; --card: #222923; --fg: #ede6d6; --muted: #cdb89a; --accent: #86b08d; --live: #e07a4f; --line: #343d35; } }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; padding: 16px; }
  main { max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 12px; }
  #map { height: 58vh; min-height: 300px; border-radius: 20px; border: 1px solid var(--line); }
  h1 { font: 700 1.5rem/1.2 ui-serif, Georgia, serif; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .badge { color: #fff; background: var(--live); border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 800; letter-spacing: .05em; }
  .badge.off { background: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
  .stats b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--live); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(180,83,42,.25); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div id="map"></div>
  <div class="card">
    <div class="row">
      <div><h1 id="who">Live ride</h1><div id="title" class="muted">Loading…</div></div>
      <span id="badge" class="badge off">…</span>
    </div>
    <div class="stats">
      <div><b id="dist">–</b><span class="muted">miles</span></div>
      <div><b id="speed">–</b><span class="muted">mph</span></div>
      <div><b id="time">–</b><span class="muted">ride time</span></div>
    </div>
    <p id="updated" class="muted" style="margin:12px 0 0"></p>
  </div>
  <p class="muted" style="text-align:center">Shared from <a href="./">Trailway</a>. The link stops working when the ride ends.</p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Reads one "LiveRide" record from Trailway's public iCloud database (read-only web token).
  const TOKEN = "330c6d540fa283705727edee72b5ac1e4994117eea66e35d18cb5cc428b2b67b";
  const API = "https://api.apple-cloudkit.com/database/1/iCloud.com.moonrcks.Trailway/production/public/records/lookup?ckAPIToken=" + TOKEN;
  const id = new URLSearchParams(location.search).get("r") || "";
  const $ = (x) => document.getElementById(x);

  const map = L.map("map", { zoomControl: true }).setView([40.0, -83.0], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  const path = L.polyline([], { color: "#c98a2e", weight: 5 }).addTo(map);
  const marker = L.marker([40.0, -83.0], { icon: L.divIcon({ className: "", html: '<div class="dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) });
  let placed = false;

  function decode(s) {   // Google polyline encoding, as the app writes it
    const out = []; let i = 0, lat = 0, lon = 0;
    while (i < s.length) {
      for (const k of [0, 1]) {
        let shift = 0, result = 0, b;
        do { b = s.charCodeAt(i++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
        const d = (result & 1) ? ~(result >> 1) : (result >> 1);
        if (k === 0) lat += d; else lon += d;
      }
      out.push([lat / 1e5, lon / 1e5]);
    }
    return out;
  }
  const v = (f, k) => f[k] ? f[k].value : undefined;
  function clock(s) { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }

  function ended(text) {
    $("badge").textContent = "ENDED"; $("badge").className = "badge off";
    $("title").textContent = text; $("updated").textContent = "";
  }

  async function refresh() {
    if (!/^live_[a-f0-9]{32}$/.test(id)) return ended("This link isn't a live ride.");
    try {
      const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
                                     body: JSON.stringify({ records: [{ recordName: id }] }) });
      const rec = (await res.json()).records?.[0];
      if (!rec || !rec.fields) return ended("This ride has ended, so its location is no longer shared.");
      const f = rec.fields, here = [v(f, "lat"), v(f, "lon")];
      const updated = new Date(v(f, "updatedAt")), stale = Date.now() - updated > 120000;
      $("who").textContent = "@" + v(f, "handle");
      $("title").textContent = v(f, "title") || "Ride";
      $("badge").textContent = stale ? "NO SIGNAL" : "LIVE"; $("badge").className = stale ? "badge off" : "badge";
      $("dist").textContent = ((v(f, "distance") || 0) / 1609.344).toFixed(1);
      $("speed").textContent = ((v(f, "speed") || 0) * 2.236936).toFixed(1);
      $("time").textContent = clock(v(f, "elapsed"));
      $("updated").textContent = "Updated " + updated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      path.setLatLngs(v(f, "track") ? decode(v(f, "track")) : []);
      marker.setLatLng(here);
      if (!placed) { marker.addTo(map); map.setView(here, 15); placed = true; }
      document.title = "@" + v(f, "handle") + " is riding live";
    } catch (e) {
      $("updated").textContent = "Can't reach Trailway right now. Trying again…";
    }
  }
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
